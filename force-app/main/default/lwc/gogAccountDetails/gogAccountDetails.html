        <template if:true={checkStickyPopup}>
            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading" aria-modal="true"
                aria-describedby="modal-content-id" class="slds-modal slds-fade-in-open">
                <div>
                    <div class="slds-modal__container">
                        <header class="slds-docked-composer__header"
                        style="position: relative;padding-right: 0rem;">
                        <lightning-layout>
                            <lightning-layout-item size=10 class="layout-item slds-truncate" style="cursor: pointer;">
                                <h3 style="line-height: 1.46;font-weight:600">Latest Note</h3>
                            </lightning-layout-item>
                            <lightning-layout-item class="layout-item1" size=2>
                                <button class="slds-button slds-button_icon slds-button_icon" style="float: right;padding-right: 0.5rem;" title="Close" onclick={closeStickyPopup}>
                                    <lightning-icon icon-name="utility:close" size=" x-small" ></lightning-icon>
                                    <span class="slds-assistive-text">Close</span>
                                </button>
                            </lightning-layout-item>
                        </lightning-layout>
                            <!-- <button
                                class="slds-button slds-modal__close closeIcon slds-button_icon-bare slds-button_icon-inverse"
                                title=Close onclick={closeStickyPopup}>
                                <lightning-icon icon-name="utility:close" size="small" variant="inverse"
                                    alternative-text=Close>
                                </lightning-icon>
                                <span class="slds-assistive-text">Close</span>
                            </button> -->
                        </header>
                        <div class="slds-modal__content slds-p-around_medium">
                            <div>
                                <textarea rows=20 maxlength=100000 class="slds-textarea" onchange={updateStickyNotes}>
                                    {stickyNotes}
                                </textarea>
                            </div>
                        </div>
                        <footer class="slds-modal__footer">
                            <button class="slds-button slds-button_neutral" style="padding-left: 0.5rem;"
                                onclick={closeStickyPopup}>{label.Cancel}</button>
                            <button class="slds-button slds-button_brand"
                                onclick={stickyNotesSave}>{label.Save}</button>
                        </footer>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </div>
</template>
