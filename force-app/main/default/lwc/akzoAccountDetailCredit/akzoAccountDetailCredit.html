                     margin-right: 10px;"></lightning-icon>
               <lightning-layout>
                  <div class="subContent-padding subcontent__txt_style" style={headerNoteContentWidth}>
                     <lightning-layout-item class="slds-grid" size="12">
                        <p title={stickyNotes}
                           class="span-padding slds-truncate spanScroll slds-grid slds-size_11-of-12"
                           if:false={isEditable} style={spanBackground}>{stickyNotes}</p>
                        <textarea style="max-height:4.5rem;min-height:4.5rem;height:4.5rem;" data-info="inline"
                           if:true={isEditable} onblur={checkIsEditableFalse} onchange={updateStickyNotes} rows="4"
                           cols="50" placeholder="Click on edit to add/edit sticky notes"
                           class="slds-text-heading_small editable"> {stickyNotes}
                         </textarea>
                     </lightning-layout-item>
                  </div>
               </lightning-layout>
               <lightning-layout class="value_saperater" style="margin-top: 1rem;">
               </lightning-layout>
               <lightning-layout style="padding-top: 4px;padding-bottom: 2px;" verticalalign="end">
                  <lightning:layoutItem alignmentbump="right" style="min-width: 48%;">
                     <span data-id="thumbnail" class="slds-swatch spanColor"
                        style="width: 14px;height: 14px;border-radius: 2px;border: solid 1px #F5FBA4;background: rgba(231, 245, 29, 0.404);"
                        onclick={changeNoteColor}></span>&nbsp;

                        style="width: 14px;height: 14px;border-radius: 2px;border: solid 1px #DBFBB5;background: rgba(169, 245, 81, 0.425);"
                        onclick={changeNoteColor}></span>&nbsp;

      <template if:true={checkStickyPopup}>

            aria-describedby="modal-content-id" class="slds-modal slds-fade-in-open">
            <div>
               <div class="slds-modal__container">
                  <header style="position: relative">
                     <button
                        class="slds-button slds-modal__close closeIcon slds-button_icon-bare slds-button_icon-inverse"
                        title=Close onclick={closeStickyPopup}>
                        <lightning-icon icon-name="utility:close" size="small" variant="inverse" alternative-text=Close>
                        </lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                     </button>
                  </header>
                  <div class="slds-modal__content slds-p-around_medium">
                     <div>
                        <textarea rows=20 maxlength=100000 class="slds-textarea" onchange={updateStickyNotes}>
                                  {stickyNotes}
                              </textarea>
                     </div>
                  </div>
                  <footer class="slds-modal__footer">
                     <button class="slds-button slds-button_neutral" style="padding-left: 0.5rem;"
                        onclick={closeStickyPopup}>Cancel</button>
                     <button class="slds-button slds-button_brand" onclick={stickyNotesSave}>Save</button>
                  </footer>
               </div>
            </div>
         </section>
